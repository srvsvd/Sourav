<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVDInc_SYS034_SRVSVD41VE</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://kit.fontawesome.com/3adb7007d7.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="wrapper">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username (Phone No./Mail ID)" required>
                <i class="fa-solid fa-user"></i>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Password" required>
                <i class="fa-solid fa-lock"></i>
            </div>

            <div class="remember-forget">
                <label><input type="checkbox">Remember me</label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Don't have an account?<a href="register.html">Register</a></p> 
                <br><p><b>SVDInc Corporation 2025 - SYS034</b></p><br>
                <p><b>Sourav Dey (SRVSVD)</b></p>

            </div>
        </form>
    </div>
    <script>
        // Auto-fill from localStorage
        window.onload = function () {
            const savedUser = localStorage.getItem("username");
            const savedPass = localStorage.getItem("password");
    
            if (savedUser) document.querySelector("input[type='text']").value = savedUser;
            if (savedPass) document.querySelector("input[type='password']").value = savedPass;
        };
    
        // Handle Login
        document.querySelector("form").addEventListener("submit", function (e) {
            e.preventDefault();
    
            const username = document.querySelector("input[type='text']").value;
            const password = document.querySelector("input[type='password']").value;
    
            // Validate against stored credentials
            const storedUser = localStorage.getItem("regUsername");
            const storedPass = localStorage.getItem("regPassword");
    
            if (username === storedUser && password === storedPass) {
                localStorage.setItem("username", username);
                localStorage.setItem("password", password);
    
                const blob = new Blob([`Username: ${username}\nPassword: ${password}`], { type: "text/plain" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "user_credentials.txt";
                link.click();
    
                showToast("✅ Login Successful! Credentials saved.");
            } else {
                showToast("❌ Invalid Username or Password!");
            }
        });
    
        function showToast(msg) {
            const toast = document.createElement("div");
            toast.innerText = msg;
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: #333;
                color: white;
                padding: 12px 20px;
                border-radius: 8px;
                z-index: 9999;
                font-family: sans-serif;
            `;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>

</html>
